<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203f36">
  <title>New celebrations · The Word Woods</title>
  <link rel="icon" href="./assets/readling.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./new-celebrations.css">
  <script type="module" src="./new-celebrations.js"></script>
</head>
<body class="study-page">
  <header class="mast"><div class="wrap"><a href="./" class="brand"><img src="./assets/readling.svg" width="34" height="34" alt="">Readling</a><a href="./celebrations.html">Game celebrations ↗</a></div></header>
  <main class="wrap">
    <h1>New celebrations</h1>
    <nav id="families" aria-label="Choose a celebration family"></nav>
    <section aria-labelledby="family"><div class="heading"><div><h2 id="family"></h2><p id="intro"></p></div><button type="button" id="together">Play together</button></div>
      <div id="studies"></div>
    </section>
    <p role="status" id="message"></p>
    <noscript>Enable JavaScript to play the celebrations.</noscript>
  </main>
  <template id="study-card"><article>
    <div class="plate"><img class="poster" alt=""><canvas aria-hidden="true"></canvas></div>
    <div class="body"><span class="level"></span><h3></h3><p class="caption"></p>
      <div class="controls"><button type="button" class="play">Play</button><input class="scrub" type="range" min="0" step="1" value="0"><output></output></div>
    </div>
  </article></template>
</body>
</html>
