<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ember Orca · Celebration preview</title><link rel="icon" href="./assets/readling.svg"><link rel="stylesheet" href="./style.css">
<style>
:root{--paper:#f7f3e9;--rule:#cdc9bc;--ink:#293d34;--ember:#ac593d}body{background:var(--paper);color:var(--ink)}.sheet{width:min(1140px,calc(100% - clamp(32px,8vw,108px)));margin-inline:auto}header{border-bottom:1px solid var(--rule)}header .sheet{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}.brandlink{display:flex;align-items:center;gap:9px;font:27px var(--serif);letter-spacing:-1.3px;text-decoration:none}.brandlink img{width:34px}.backlink{font-size:14px;font-weight:800}
main{padding-block:clamp(26px,4vw,48px) 45px}.intro{margin-bottom:25px}h1{font-size:clamp(46px,6vw,79px);line-height:1.02;letter-spacing:-.065em}.intro p{margin-top:8px;color:#506058;font-size:17px}
.layout{display:grid;grid-template-columns:minmax(0,1.93fr) minmax(240px,1fr);gap:clamp(16px,3vw,34px);align-items:start}.viewer{border:1px solid #bebdac;border-radius:15px;background:#fffcf3;overflow:hidden;box-shadow:0 2px 0 #dbd6c7}
.stage{position:relative;isolation:isolate;aspect-ratio:640/344;overflow:hidden;background:#efebde}.stage[data-surface=grid]{background:repeating-conic-gradient(#e1ded1 0% 25%,#f8f5ed 0% 50%) 0 0/22px 22px}.stage[data-surface=night]{background:#263f41}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.controls{display:flex;align-items:center;gap:12px;padding:12px 15px;border-top:1px solid var(--rule)}
button,input,select{font:inherit}button{cursor:pointer}.play{background:#294538;color:#fff8e8;border:0;border-radius:22px;min-width:88px;padding:8px 12px;min-height:40px;font-weight:800}.controls input{min-width:0;flex:1;accent-color:#99563e}.clock{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#52625a}
.layers{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 1px;color:#4a5a50;font-size:14px}.layers label{display:inline-flex;align-items:center;gap:7px;min-height:34px}.layers select{border:1px solid var(--rule);border-radius:7px;padding:4px 7px;color:var(--ink);background:#fffdf4}.layers input{accent-color:#294538;width:17px;height:17px}.layers label+label{margin-left:auto}
.choices{display:grid;gap:10px}.choice{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:12px;padding:10px;text-align:left;border:1px solid var(--rule);border-radius:12px;background:#fbf8ed;color:var(--ink)}.choice[aria-pressed=true]{background:#fff9e9;border-color:#855d47;box-shadow:inset 3px 0 #a65f43}.choice:hover{border-color:#825f4c}
.thumb{width:100%;aspect-ratio:1.14;border-radius:7px;background:#e8ddce}.choice small{display:block;font-weight:850;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:#87583e}.choice strong{display:block;font:clamp(19px,2.3vw,28px)/1.08 var(--serif);letter-spacing:-.04em}.choice span span{display:block;margin-top:4px;font-size:13px;line-height:1.3;color:#526259}.play:focus-visible,.choice:focus-visible{outline-offset:2px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.choices{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.choice{grid-template-columns:1fr;padding:9px;align-content:start;gap:7px}.thumb{aspect-ratio:2}.choice strong{font-size:18px}.choice span span{font-size:12px}.intro{margin-bottom:16px}.clock{font-size:12px}.controls{gap:7px;padding:9px}.play{min-width:72px}}
@media(max-width:480px){.choices{grid-template-columns:1fr}.choice{grid-template-columns:67px 1fr;align-items:center}.thumb{aspect-ratio:1.4}.choice strong{font-size:21px}.layers{gap:3px}}
</style></head>
<body><header><div class="sheet"><a class="brandlink" href="./"><img src="./assets/readling.svg" alt="">Readling</a><a class="backlink" href="./whale-studies.html">← Whale studies</a></div></header>
<main class="sheet"><div class="intro"><h1>The Ember Orca</h1><p>Choose a level to play its breach. Drag the timeline to inspect the turn or the landing.</p></div>
<div class="layout"><div><div class="viewer"><div class="stage" id="stage" data-surface="grid"><canvas id="stars" width="640" height="344" aria-hidden="true"></canvas><canvas id="orca" width="640" height="344" role="img" aria-label="Ember orca animation preview"></canvas></div>
<div class="controls"><button id="play" class="play" type="button">▶ Play</button><input id="time" aria-label="Animation timeline" type="range" min="0" max="1" step=".005" value="0"><span id="clock" class="clock"></span></div></div>
<div class="layers"><label>Preview surface <select id="surface"><option value="grid">Transparency grid</option><option value="paper">Paper</option><option value="night">Dark</option></select></label><label><input type="checkbox" id="layer">Show stars behind</label></div></div>
<div id="choices" class="choices" role="group" aria-label="Orca levels"></div></div><noscript>Enable JavaScript to play the previews.</noscript></main>
<script type="module" src="./ember-preview.js"></script></body></html>
