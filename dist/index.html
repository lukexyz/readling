<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#274031">
  <meta name="apple-mobile-web-app-title" content="Readling">
  <meta name="description" content="Sound out a word, write its letters and discover what is hiding in the Word Woods.">
  <title>Readling · The Word Woods</title>
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="./assets/readling.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" as="font" type="font/ttf" href="./assets/fonts/young-serif.ttf" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./celebrations.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the game</a>
  <div id="game-page">
    <header id="masthead"></header>
    <div id="shelf"></div>
    <main id="main" class="wrap" tabindex="-1"></main>
  </div>
  <footer id="save-footer" hidden></footer>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <dialog id="sticker-picker" aria-labelledby="sticker-title">
    <div class="dialog-top"><h2 id="sticker-title" tabindex="-1" autofocus>You earned a sticker!</h2>
      <form method="dialog"><button class="btn secondary" type="submit">Later</button></form>
    </div>
    <div class="show-picks"></div>
  </dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" role="status" hidden></div>
  <noscript>Turn on JavaScript to play the Word Woods reading game.</noscript>
</body>
</html>
